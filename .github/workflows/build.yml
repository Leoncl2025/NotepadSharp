name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: build
  QT_VERSION: 6.5.3

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qt5compat'
          cache: true

      - name: Setup Visual Studio Tools
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: '3.12'

      - name: Configure
        run: >-
          cmake -S . -B "${{ env.BUILD_DIR }}" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel

      - name: Test
        run: ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure

      - name: Prepare Source Archive
        shell: pwsh
        run: |
          Remove-Item -Path aqtinstall.log -Force -ErrorAction SilentlyContinue
          $changes = @(git status --porcelain --untracked-files=all)
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw 'The source tree must be clean before packaging.'
          }

      - name: Package Installer and Portable Build
        run: cmake --build "${{ env.BUILD_DIR }}" --target installer_bundle --parallel

      - name: Verify Package Artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path '${{ github.workspace }}' '${{ env.BUILD_DIR }}\artifacts'
          $patterns = @(
            'NotepadSharp-*-Setup.exe'
            'NotepadSharp-*-Portable.zip'
            'NotepadSharp-*-source.zip'
            'SHA256SUMS.txt'
          )

          foreach ($pattern in $patterns) {
            $matches = @(Get-ChildItem -Path $artifactDir -Filter $pattern -File)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one artifact matching $pattern, found $($matches.Count)."
            }
          }

          Get-ChildItem -Path $artifactDir -File | Select-Object Name, Length
          Get-Content (Join-Path $artifactDir 'SHA256SUMS.txt')

      - name: Upload Windows Installer and Portable Bundle
        uses: actions/upload-artifact@v7
        with:
          name: NotepadSharp-Windows-x64
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Draft Windows Release
    runs-on: ubuntu-24.04
    needs: windows

    if: github.repository == 'Leoncl2025/NotepadSharp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows Bundle
        uses: actions/download-artifact@v8
        with:
          name: NotepadSharp-Windows-x64
          path: release-artifacts

      - name: Create Draft Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --draft
          fi
          gh release upload "${{ github.ref_name }}" release-artifacts/* --clobber
