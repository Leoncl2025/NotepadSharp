name: "Build Notepad #"

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

env:
  QT_RELEASE_VER: 6.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
        qt_version: ["6.5", "6.8", "6.10"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          modules: 'qt5compat'
          cache: true

      - name: Setup Visual Studio Tools
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Install NSIS
        if: runner.os == 'Windows'
        uses: repolevedavaj/install-nsis@v1.2.1
        with:
          nsis-version: '3.12'

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          echo "DISTRIBUTION=AppImage" >> "$GITHUB_ENV"

          # Qt 6.10+ renamed wayland plugins
          if [[ "${{ matrix.qt_version }}" == "6.10" ]]; then
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland.so" >> "$GITHUB_ENV"
          else
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so" >> "$GITHUB_ENV"
          fi

          sudo apt-get install libxkbcommon-dev libxkbcommon-x11-0 fuse libxcb-cursor-dev libcups2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION=${{ env.DISTRIBUTION }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build Windows Targets
        if: runner.os == 'Windows'
        run: cmake --build build --target installer_bundle --parallel

      - name: Build MacOS Targets
        if: runner.os == 'macOS'
        run: cmake --build build --target dmg --parallel

      - name: Build Linux Targets
        if: runner.os == 'Linux'
        run: cmake --build build --target appimage --parallel

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: NotepadSharp-Windows-Qt${{ matrix.qt_version }}-Portable
          path: ${{ github.workspace }}/build/artifacts/NotepadSharp-*-Portable.zip

      - name: Upload Windows Source
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: NotepadSharp-Windows-Qt${{ matrix.qt_version }}-Source
          path: ${{ github.workspace }}/build/artifacts/NotepadSharp-*-source.zip

      - name: Upload Windows Checksums
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: NotepadSharp-Windows-Qt${{ matrix.qt_version }}-Checksums
          path: ${{ github.workspace }}/build/artifacts/SHA256SUMS.txt

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: NotepadSharp-Windows-Qt${{ matrix.qt_version }}-Installer
          path: ${{ github.workspace }}/build/artifacts/NotepadSharp*.exe

      - name: Upload MacOS dmg
        uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: NotepadSharp-macOS-Qt${{ matrix.qt_version }}
          path: ${{ github.workspace }}/build/NotepadSharp*.dmg

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: NotepadSharp-Linux-Qt${{ matrix.qt_version }}-AppImage
          path: ${{ github.workspace }}/build/NotepadSharp*.AppImage

  github:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    if: github.repository == 'Leoncl2025/NotepadSharp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create Draft Release
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes --draft

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Upload Windows Installer
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-Windows-Qt$QT_RELEASE_VER-Installer/NotepadSharp-*.exe

      - name: Upload Windows Zip
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-Windows-Qt$QT_RELEASE_VER-Portable/NotepadSharp-*-Portable.zip

      - name: Upload Windows Source
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-Windows-Qt$QT_RELEASE_VER-Source/NotepadSharp-*-source.zip

      - name: Upload Windows Checksums
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-Windows-Qt$QT_RELEASE_VER-Checksums/SHA256SUMS.txt

      - name: Upload Linux AppImage
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-Linux-Qt$QT_RELEASE_VER-AppImage/NotepadSharp-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload macOS App
        run: |
          gh release upload ${{ github.ref_name }} NotepadSharp-macOS-Qt$QT_RELEASE_VER/NotepadSharp-${{ github.ref_name }}.dmg
